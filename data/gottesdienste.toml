# Gemeindekalender
# Aufnehmen: Mittwochabend, Samstag, Sonntag, alle Jungverheirateten-Veranstaltungen,
#            Zusatzveranstaltungen vor Ort
# Weglassen: Prediger-Veranstaltungen, Ausfahrten zu anderen Gemeinden
# Quelle: Aushänge „Unsere Gottesdienste im November/Dezember 2026" (Änderungen vorbehalten)
