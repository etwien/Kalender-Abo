# ---------- Regeltermine ----------
# Gelten automatisch für die nächsten 12 Monate (täglich fortgeschrieben).
# Sobald ein Monatsplan abfotografiert ist, Monat hier eintragen –
# dann gilt für diesen Monat ausschließlich der Plan unten.
